name: Rapèl chak wikenn

on:
  schedule:
    # Chak vandredi, 3:00 PM lè Ayiti (America/Port-au-Prince = UTC-5,
    # kidonk 20:00 UTC). GitHub Actions itilize UTC toujou.
    - cron: "0 20 * * 5"
  workflow_dispatch: {} # pèmèt ou deklanche l manyèlman tou pou teste

jobs:
  send-weekly-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enstale depandans
        working-directory: ./scripts
        run: npm install
      - name: Voye rapèl la
        working-directory: ./scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node send-notifications.js weekly
